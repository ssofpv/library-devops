name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Get complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        run: make secret-check

      - name: Save secret scan report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: secret-scan-report
          path: reports/gitleaks.json
          if-no-files-found: warn
          retention-days: 14
  checks:
    name: Checks / ${{ matrix.check }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        check: ["quality", "sast", "dependency-check"]

    env:
      DJANGO_SECRET_KEY: "ci-only-test-key-not-for-deployment"
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: make setup

      - name: Run selected check
        run: make ${{ matrix.check }}
        
      - name: Save analyzer reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: analyzer-reports-${{ matrix.check }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
  verify:
    name: Verify Python ${{ matrix.python-version }}
    needs: [checks, secret-scan]
    if: always()
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    env:
      DJANGO_SECRET_KEY: "ci-only-test-key-not-for-deployment"
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"

    steps:
      - name: Require successful checks
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$SECRET_SCAN_RESULT" = success

      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: make setup

      - name: Check Django configuration and migrations
        run: |
          .venv/bin/python manage.py check
          .venv/bin/python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: make test
        
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: python-reports-${{ matrix.python-version }}
          path: |
            test-results/
            coverage.xml
          if-no-files-found: warn
          retention-days: 14

  container-check:
    name: Container check
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check Docker tools
        run: |
          docker version
          docker compose version

      - name: Check container environment
        shell: bash
        run: |
          make container-check CONTAINER_PYTHON=python 2>&1 | tee "$RUNNER_TEMP/container-check.log"

      - name: Save container check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-check-log
          path: ${{ runner.temp }}/container-check.log
          if-no-files-found: warn
          retention-days: 7