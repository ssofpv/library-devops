name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Get complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        run: make secret-check

      - name: Save secret scan report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: secret-scan-report
          path: reports/gitleaks.json
          if-no-files-found: warn
          retention-days: 14
  checks:
    name: Checks / ${{ matrix.check }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        check: ["quality", "sast", "dependency-check"]

    env:
      DJANGO_SECRET_KEY: "ci-only-test-key-not-for-deployment"
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: make setup

      - name: Run selected check
        run: make ${{ matrix.check }}
        
      - name: Save analyzer reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: analyzer-reports-${{ matrix.check }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  db-checks:
    name: Database / ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        check: ["db-migrations", "db-backup"]

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Run database check
        shell: bash
        run: |
          set -o pipefail
          make "${{ matrix.check }}" CONTAINER_PYTHON=python 2>&1 | tee "$RUNNER_TEMP/${{ matrix.check }}.log"

      - name: Save database check log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.check }}-log
          path: ${{ runner.temp }}/${{ matrix.check }}.log
          if-no-files-found: warn
          retention-days: 14

  verify:
    name: Verify Python ${{ matrix.python-version }}
    needs: [checks, secret-scan, db-checks]
    if: always()
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    env:
      DJANGO_SECRET_KEY: "ci-only-test-key-not-for-deployment"
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"

    steps:
      - name: Require successful checks
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          DB_CHECKS_RESULT: ${{ needs.db-checks.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$SECRET_SCAN_RESULT" = success
          test "$DB_CHECKS_RESULT" = success

      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: make setup

      - name: Check Django configuration and migrations
        run: |
          .venv/bin/python manage.py check
          .venv/bin/python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: make test
        
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: python-reports-${{ matrix.python-version }}
          path: |
            test-results/
            coverage.xml
          if-no-files-found: warn
          retention-days: 14

  build-image:
    name: Build candidate image
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "library-candidate:${GITHUB_SHA}" .

      - name: Save image
        run: docker save "library-candidate:${GITHUB_SHA}" -o "$RUNNER_TEMP/candidate-image.tar"

      - name: Upload image
        uses: actions/upload-artifact@v6
        with:
          name: candidate-image
          path: ${{ runner.temp }}/candidate-image.tar
          if-no-files-found: error
          retention-days: 1

  container-check:
    name: Container check
    needs: [verify, build-image]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Require successful build and verification
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          BUILD_RESULT: ${{ needs.build-image.result }}
        run: |
          test "$VERIFY_RESULT" = success
          test "$BUILD_RESULT" = success
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check Docker tools
        run: |
          docker version
          docker compose version

      - name: Download candidate image
        uses: actions/download-artifact@v7
        with:
          name: candidate-image
          path: ${{ runner.temp }}

      - name: Load candidate image
        run: docker load -i "$RUNNER_TEMP/candidate-image.tar"

      - name: Inspect installed Python packages
        run: |
          docker run --rm --entrypoint python \
            "library-candidate:${GITHUB_SHA}" -m pip list
          docker run --rm --entrypoint python \
            "library-candidate:${GITHUB_SHA}" -m pip debug

      - name: Scan candidate image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: library-candidate:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: trivy-report.json
          exit-code: "1"

      - name: Save Trivy report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trivy-image-report
          path: trivy-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Check container environment
        shell: bash
        run: |
          make container-check CONTAINER_PYTHON=python CANDIDATE_IMAGE="library-candidate:${GITHUB_SHA}" 2>&1 | tee "$RUNNER_TEMP/container-check.log"

      - name: Save container check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-check-log
          path: ${{ runner.temp }}/container-check.log
          if-no-files-found: warn
          retention-days: 7