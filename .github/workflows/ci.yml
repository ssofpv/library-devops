name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Get complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        run: make secret-check

      - name: Save secret scan report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: secret-scan-report
          path: reports/gitleaks.json
          if-no-files-found: warn
          retention-days: 14
  checks:
    name: Checks / ${{ matrix.check }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        check: ["quality", "sast", "dependency-check"]

    env:
      DJANGO_SECRET_KEY: "ci-only-test-key-not-for-deployment"
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: make setup

      - name: Run selected check
        run: make ${{ matrix.check }}

      - name: Save analyzer reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: analyzer-reports-${{ matrix.check }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  db-checks:
    name: Database / ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        check: ["db-migrations", "db-backup"]

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Run database check
        shell: bash
        run: |
          set -o pipefail
          make "${{ matrix.check }}" CONTAINER_PYTHON=python 2>&1 | tee "$RUNNER_TEMP/${{ matrix.check }}.log"

      - name: Save database check log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.check }}-log
          path: ${{ runner.temp }}/${{ matrix.check }}.log
          if-no-files-found: warn
          retention-days: 14

  verify:
    name: Verify Python ${{ matrix.python-version }}
    needs: [checks, secret-scan, db-checks]
    if: always()
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    env:
      DJANGO_SECRET_KEY: "ci-only-test-key-not-for-deployment"
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"

    steps:
      - name: Require successful checks
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          DB_CHECKS_RESULT: ${{ needs.db-checks.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$SECRET_SCAN_RESULT" = success
          test "$DB_CHECKS_RESULT" = success

      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: make setup

      - name: Check Django configuration and migrations
        run: |
          .venv/bin/python manage.py check
          .venv/bin/python manage.py makemigrations --check --dry-run

      - name: Test staging deployment barriers
        run: .venv/bin/python scripts/test_deploy_staging.py

      - name: Run tests
        run: make test

      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: python-reports-${{ matrix.python-version }}
          path: |
            test-results/
            coverage.xml
          if-no-files-found: warn
          retention-days: 14

  build-image:
    name: Build candidate image
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Build image
        run: >-
          docker build
          --build-arg APP_REVISION="${GITHUB_SHA}"
          -t "library-candidate:${GITHUB_SHA}" .

      - name: Save image
        run: docker save "library-candidate:${GITHUB_SHA}" -o "$RUNNER_TEMP/candidate-image.tar"

      - name: Upload image
        uses: actions/upload-artifact@v6
        with:
          name: candidate-image
          path: ${{ runner.temp }}/candidate-image.tar
          if-no-files-found: error
          retention-days: 1

  container-check:
    name: Container check
    needs: [verify, build-image]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Require successful build and verification
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          BUILD_RESULT: ${{ needs.build-image.result }}
        run: |
          test "$VERIFY_RESULT" = success
          test "$BUILD_RESULT" = success
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check Docker tools
        run: |
          docker version
          docker compose version

      - name: Download candidate image
        uses: actions/download-artifact@v7
        with:
          name: candidate-image
          path: ${{ runner.temp }}

      - name: Load candidate image
        run: docker load -i "$RUNNER_TEMP/candidate-image.tar"

      - name: Check container environment
        shell: bash
        run: |
          make container-check CONTAINER_PYTHON=python CANDIDATE_IMAGE="library-candidate:${GITHUB_SHA}" 2>&1 | tee "$RUNNER_TEMP/container-check.log"

      - name: Scan candidate image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: library-candidate:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: trivy-report.json
          exit-code: "1"

      - name: Save Trivy report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trivy-image-report
          path: trivy-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Save container check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-check-log
          path: ${{ runner.temp }}/container-check.log
          if-no-files-found: warn
          retention-days: 7
  publish-image:
    name: Publish image to GHCR
    needs: [build-image, container-check]
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.build-image.result == 'success' &&
        needs.container-check.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download checked image
        uses: actions/download-artifact@v7
        with:
          name: candidate-image
          path: ${{ runner.temp }}

      - name: Load checked image
        run: docker load -i "$RUNNER_TEMP/candidate-image.tar"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Tag and publish image
        run: |
          IMAGE_NAME="ghcr.io/ssofpv/library-devops:${GITHUB_SHA}"
          docker tag "library-candidate:${GITHUB_SHA}" "$IMAGE_NAME"
          docker push "$IMAGE_NAME"

  deploy-staging:
    name: Deploy and accept staging release
    needs: publish-image
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.publish-image.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: library-staging-deploy
      cancel-in-progress: false

    steps:
      - name: Connect to the staging network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:library-cd
          ping: 100.89.219.57

      - name: Deploy published SHA and require acceptance
        shell: bash
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$STAGING_SSH_KEY"
          test -n "$STAGING_KNOWN_HOSTS"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          umask 077
          key_dir=$(mktemp -d)
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s\n' "$STAGING_SSH_KEY" > "$key_dir/key"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$key_dir/known_hosts"
          ssh-keygen -y -P '' -f "$key_dir/key" > /dev/null
          ssh -i "$key_dir/key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$key_dir/known_hosts" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            library-deploy@100.89.219.57 \
            "sudo -n /usr/bin/python3 /opt/library-staging/deploy_staging.py ${GITHUB_SHA}"
