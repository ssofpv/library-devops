name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    env:
      DJANGO_SECRET_KEY: "ci-only-test-key-not-for-deployment"
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: make setup

      - name: Run checks
        run: make verify

  container-check:
    name: Container check
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check Docker tools
        run: |
          docker version
          docker compose version

      - name: Check container environment
        shell: bash
        run: |
          make container-check CONTAINER_PYTHON=python 2>&1 | tee "$RUNNER_TEMP/container-check.log"

      - name: Save container check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-check-log
          path: ${{ runner.temp }}/container-check.log
          if-no-files-found: warn
          retention-days: 7