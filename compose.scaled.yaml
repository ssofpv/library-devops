x-app-environment: &app-environment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DJANGO_DB_ENGINE: postgresql
  POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"

x-app: &app
  build:
    context: .
  image: ${SCALED_APP_IMAGE:-library-app:lr4-79}
  user: "10001:10001"
  depends_on:
    db:
      condition: service_healthy
  networks:
    - proxy
    - backend
  mem_limit: 512m
  cpus: 1.0
  stop_grace_period: 40s
  restart: unless-stopped

services:
  db:
    extends:
      file: compose.yaml
      service: db

  app1:
    <<: *app
    environment:
      <<: *app-environment
      APP_INSTANCE_ID: app1

  app2:
    <<: *app
    environment:
      <<: *app-environment
      APP_INSTANCE_ID: app2

  nginx:
    image: nginx:stable-alpine@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-18000}:8080"
    networks:
      - frontend
      - proxy
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -T
        - "4"
        - -O
        - /dev/null
        - http://127.0.0.1:8080/health/
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    mem_limit: 64m
    cpus: 0.25
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  frontend:
  proxy:
    internal: true
  backend:
    internal: true