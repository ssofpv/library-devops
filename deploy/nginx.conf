worker_processes 1;
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format upstream_log
        '$remote_addr "$request" status=$status '
        'upstream=$upstream_addr upstream_status=$upstream_status';

    access_log /dev/stdout upstream_log;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    upstream library_app {
        zone library_app 64k;
        server app1:8000 max_fails=1 fail_timeout=10s;
        server app2:8000 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 8080;
        server_name _;

        location / {
            proxy_pass http://library_app;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 2s;
            proxy_send_timeout 30s;
            proxy_read_timeout 35s;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}