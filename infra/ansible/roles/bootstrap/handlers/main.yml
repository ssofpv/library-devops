---
- name: Validate the complete SSH configuration
  ansible.builtin.command:
    argv:
      - /usr/sbin/sshd
      - -t
  changed_when: false
  listen: Apply SSH configuration

- name: Reload SSH configuration
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded
  listen: Apply SSH configuration


- name: Reload library firewall
  ansible.builtin.systemd_service:
    name: library-firewall
    daemon_reload: true
    state: reloaded
  listen: Apply library firewall