---
- name: Check the supported Docker architecture
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] == 'x86_64'
    fail_msg: "Docker installation is configured for amd64."

- name: Create the APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the Docker repository signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
    force: true

- name: Configure the Docker APT repository
  ansible.builtin.template:
    src: docker.sources.j2
    dest: /etc/apt/sources.list.d/docker.sources
    owner: root
    group: root
    mode: "0644"
  register: library_docker_repository

- name: Install the selected Docker packages
  ansible.builtin.apt:
    name:
      - "docker-ce={{ library_docker_version }}"
      - "docker-ce-cli={{ library_docker_version }}"
      - "containerd.io={{ library_containerd_version }}"
      - "docker-compose-plugin={{ library_docker_compose_version }}"
    state: present
    install_recommends: false
    update_cache: true
    cache_valid_time: "{{ 0 if library_docker_repository.changed else 3600 }}"

- name: Enable and start container services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - containerd
    - docker

- name: Check Docker Compose availability
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - compose
      - version
      - --short
  changed_when: false