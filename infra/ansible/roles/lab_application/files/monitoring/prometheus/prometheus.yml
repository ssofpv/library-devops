global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: library
    metrics_path: /metrics/
    static_configs:
      - targets: ["app:8000"]
  - job_name: library-lab
    static_configs:
      - targets: ["node-exporter:9100"]
