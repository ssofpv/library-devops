---
- name: Verify application and database health from the controller
  ansible.builtin.uri:
    url: "http://{{ hostvars[inventory_hostname].ansible_host }}:{{ library_http_port }}{{ library_health_path }}"
    status_code: 200
    use_proxy: false
    timeout: 5
  delegate_to: localhost
  become: false
  register: library_lab_health
  failed_when: >-
    library_lab_health.status != 200 or
    (library_lab_health.json | default({})).get('status') != 'ok'

- name: Verify the published application revision from the controller
  ansible.builtin.uri:
    url: "http://{{ hostvars[inventory_hostname].ansible_host }}:{{ library_http_port }}{{ library_version_path }}"
    status_code: 200
    use_proxy: false
    timeout: 5
  delegate_to: localhost
  become: false
  register: library_lab_version
  failed_when: >-
    library_lab_version.status != 200 or
    (library_lab_version.json | default({})).get('version') != library_app_image_tag
