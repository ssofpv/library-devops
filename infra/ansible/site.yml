---
- name: Prepare the library host
  hosts: library_hosts
  become: true
  gather_facts: true

  pre_tasks:
    - name: Check the selected environment
      ansible.builtin.assert:
        that:
          - library_environment == 'lab'
          - (ansible_play_hosts_all | length) == 1
        fail_msg: "This bootstrap stage supports exactly one lab host."

    - name: Check the supported operating system
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] is version('24.04', '==')
        fail_msg: "Ubuntu Server 24.04 is required."

  roles:
    - role: bootstrap

  tasks:
    - name: Apply pending bootstrap handlers before publishing the application port
      ansible.builtin.meta: flush_handlers
      when: library_deploy_app | default(false) | bool

    - name: Deploy and verify the application
      ansible.builtin.include_role:
        name: lab_application
      when: library_deploy_app | default(false) | bool
